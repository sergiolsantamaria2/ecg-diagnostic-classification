# @package _global_

# Fine-tune an SSL-pretrained encoder at a given label fraction. Requires a
# pretrained checkpoint, e.g. +experiment=finetune model=resnet1d
# data.label_fraction=0.1 model.pretrained_ckpt=outputs/<run>/checkpoints/best.pt

model:
  pretrained_ckpt: ???
  freeze_encoder: false

wandb:
  group: data_efficiency
  name: finetune_${model.name}_f${data.label_fraction}_s${data.subsample_seed}
  tags: [data_efficiency, finetune]
  notes: Fine-tune SSL-pretrained encoder at a label fraction
