# @package _global_

defaults:
  - override /model: cnn_transformer

trainer:
  epochs: 200

data:
  augmentations:
    crop: 500            # random 5 s window (eval uses the full 10 s)
    scaling: 0.15
    lead_mask: 2
    gaussian_noise: 0.15

wandb:
  group: baseline
  name: cnn_transformer_crop
  tags: [baseline, cnn_transformer, crop]
  notes: CNN+Transformer with random crop + strong augmentation, 200 epochs
