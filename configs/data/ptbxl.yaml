source: ptbxl
root: data/raw/ptbxl
sampling_rate: 100
drop_unlabeled: true
batch_size: 128
num_workers: 8

# Data-efficiency study: keep this fraction of the labeled train set (1.0 = all).
label_fraction: 1.0
subsample_seed: 0

# Augmentations (train only). null disables; off for the baseline.
augmentations:
  crop: null             # random window length in samples (eval uses full signal)
  temporal_shift: null   # max shift in samples
  scaling: null          # sigma of N(1, sigma)
  lead_mask: null        # max leads to zero
  gaussian_noise: null   # noise std (standardized scale)
