name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The lock resolves torch to the CUDA build (several GB of NVIDIA wheels).
      # The runner has no GPU, so install from pyproject with the CPU torch index
      # instead of syncing the lock; --no-sync below keeps uv from undoing that.
      - name: Install dependencies (CPU torch)
        run: |
          uv venv
          uv pip install --torch-backend=cpu --group dev --group serving -e .

      - name: Lint
        run: uv run --no-sync ruff check src scripts tests

      - name: Test
        run: uv run --no-sync pytest -q
