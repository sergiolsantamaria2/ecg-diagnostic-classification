[project]
name = "deep-ecg"
version = "0.1.0"
description = "Deep learning for 12-lead ECG diagnostic classification on PTB-XL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "wfdb>=4.1",
    "scikit-learn>=1.5",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_ecg"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
