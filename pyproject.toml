[project]
name = "ecg-diagnostic-classification"
version = "0.1.0"
description = "Deep learning for 12-lead ECG diagnostic classification on PTB-XL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "wfdb>=4.1",
    "scikit-learn>=1.5",
    "hydra-core>=1.3",
    "wandb>=0.17",
    "tqdm>=4.66",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "httpx>=0.27",
]
serving = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "onnx>=1.16",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_ecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The W&B run directory (`wandb/`, gitignored) sits at the repo root and would
# otherwise make ruff classify the package as first-party on this machine only.
known-third-party = ["wandb"]
